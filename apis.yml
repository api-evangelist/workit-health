aid: workit-health
name: Workit Health
description: >-
  Workit Health is a 100% virtual addiction-treatment provider delivering telehealth
  care for opioid use disorder, alcohol use disorder, and kratom/7-OH dependence via
  mobile app and video visits with licensed clinicians. Care includes FDA-approved
  medications such as Suboxone (buprenorphine/naloxone) and naltrexone, recovery
  groups, and asynchronous care-team messaging, serving members across fourteen US
  states. Backed by Insight Partners and Lux Capital. Workit Health publishes no
  public developer API, SDKs, or API documentation.
